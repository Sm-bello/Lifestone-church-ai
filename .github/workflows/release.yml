name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.windows.conf.json'
            is_lite: 'false'
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.windows-lite.conf.json -- --no-default-features --features lite'
            is_lite: 'true'

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch Core AI Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "=== Downloading heavy AI models natively via GitHub bandwidth ==="
          mkdir -p data
          mkdir -p models/whisper
          mkdir -p models/minilm-onnx/onnx
          mkdir -p src-tauri/target/release/build/examples
          mkdir -p src-tauri/target/release/build/deps
          
          gh release download v1.0.0-models -p "lifestone.db" -D data/ || curl -fSL -o data/lifestone.db "https://github.com/Sm-bello/Lifestone-church-ai/releases/download/v1.0.0-models/lifestone.db"
          if [ ! -f models/whisper/ggml-base.bin ]; then
            echo "Downloading ggml-base.bin..."
            curl -sSL -o models/whisper/ggml-base.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
          fi
          if [ ! -f models/whisper/ggml-tiny.bin ]; then
            echo "Downloading ggml-tiny.bin..."
            curl -sSL -o models/whisper/ggml-tiny.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          fi
          gh release download v1.0.0-models -p "model.onnx" -D models/minilm-onnx/onnx/ || curl -fSL -o models/minilm-onnx/onnx/model.onnx "https://github.com/Sm-bello/Lifestone-church-ai/releases/download/v1.0.0-models/model.onnx"

      - name: Verify bundled files
        shell: bash
        run: |
          echo "=== Verifying bundled offline assets ==="
          ls -la models/whisper/ 2>/dev/null || echo "models/whisper missing"
          ls -la data/lifestone.db 2>/dev/null || echo "data/lifestone.db missing"
          ls -la models/minilm-onnx/onnx/ 2>/dev/null || echo "models/minilm-onnx missing"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            patchelf \
            libasound2-dev \
            libspeechd-dev \
            libssl-dev \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GGML_AVX: ${{ matrix.is_lite == 'true' && 'OFF' || 'ON' }}
          GGML_AVX2: ${{ matrix.is_lite == 'true' && 'OFF' || 'ON' }}
          GGML_FMA: ${{ matrix.is_lite == 'true' && 'OFF' || 'ON' }}
          GGML_F16C: ${{ matrix.is_lite == 'true' && 'OFF' || 'ON' }}
          GGML_BMI2: ${{ matrix.is_lite == 'true' && 'OFF' || 'ON' }}
          GGML_AVX512: 'OFF'
        with:
          tagName: v__VERSION__
          releaseName: 'Lifestone v__VERSION__ — Spanish Bible (NTBT) & Hymnal Edition'
          releaseBody: '🇪🇸 New in v__VERSION__: Spanish Nueva Traducción BibliaTodo (NTBT) bundled 100% offline with Spanish scripture reference detection (Juan 3:16, Salmos 23, Génesis 1:1), 2,937 Church Hymns, and Plug-and-Play HDMI Auto-Detection. Download your installer below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}