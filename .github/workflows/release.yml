name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.windows.conf.json'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch Core AI Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "=== Downloading heavy AI models natively via GitHub bandwidth ==="
          mkdir -p data
          mkdir -p models/whisper
          mkdir -p models/minilm-onnx/onnx
          
          gh release download v1.0.0-models -p "lifestone.db" -D data/ || echo "Warning: lifestone.db not found in release"
          gh release download v1.0.0-models -p "ggml-nigerian.bin" -D models/whisper/ || echo "Warning: ggml-nigerian.bin not found"
          gh release download v1.0.0-models -p "model.onnx" -D models/minilm-onnx/onnx/ || echo "Warning: model.onnx not found"

      - name: Verify bundled files
        shell: bash
        run: |
          echo "=== Verifying bundled offline assets ==="
          ls -la models/whisper/ 2>/dev/null || echo "models/whisper missing"
          ls -la data/lifestone.db 2>/dev/null || echo "data/lifestone.db missing"
          ls -la models/minilm-onnx/onnx/ 2>/dev/null || echo "models/minilm-onnx missing"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            patchelf \
            libasound2-dev \
            libspeechd-dev \
            libssl-dev \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Lifestone v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}